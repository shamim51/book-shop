services:

  app:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      db:
          condition: service_healthy
    command: [ "sh", "-c", "/book-shop/bin/migrate up && /book-shop/bin/api" ]


  db:
    image: postgres:alpine
    environment:
      - POSTGRES_DB=book_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d book_db"]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: always